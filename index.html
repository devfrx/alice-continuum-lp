<!doctype html>
<html data-theme="dark" lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <title>AL\CE × CONT\NUUM — Private AI workspace</title>
    <meta
      name="description"
      content="A private AI workspace that runs on your machine and answers to no one. AL\CE, the local assistant. CONT\NUUM, the knowledge base."
    />
    <link rel="canonical" href="https://alice-continuum.vercel.app/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="AL\CE × CONT\NUUM — Private AI workspace" />
    <meta
      property="og:description"
      content="A private AI workspace that runs on your machine and answers to no one. AL\CE, the local assistant. CONT\NUUM, the knowledge base."
    />
    <meta property="og:image" content="/brand/gen/og.png" />
    <meta property="og:image:alt" content="AL\CE and CONT\NUUM wordmarks divided by a backslash" />
    <meta property="og:url" content="https://alice-continuum.vercel.app/" />
    <meta property="og:site_name" content="AL\CE × CONT\NUUM" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="AL\CE × CONT\NUUM — Private AI workspace" />
    <meta
      name="twitter:description"
      content="A private AI workspace that runs on your machine and answers to no one. AL\CE, the local assistant. CONT\NUUM, the knowledge base."
    />
    <meta name="twitter:image" content="/brand/gen/og.png" />
    <meta name="twitter:image:alt" content="AL\CE and CONT\NUUM wordmarks divided by a backslash" />

    <meta name="theme-color" content="#161616" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#faf9f5" media="(prefers-color-scheme: light)" />
    <meta name="color-scheme" content="dark light" />
    <meta name="format-detection" content="telephone=no" />

    <!-- Favicons & manifest -->
    <link rel="icon" href="/brand/gen/favicon-32.png" />
    <link rel="apple-touch-icon" href="/brand/gen/favicon-180.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Anti-flash: apply saved theme/locale before first paint -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('lp-theme');
          if (t !== 'dark' && t !== 'light')
            t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
          document.documentElement.dataset.theme = t;
          var l = localStorage.getItem('lp-locale');
          if (l !== 'en' && l !== 'it')
            l = (navigator.language || 'en').toLowerCase().startsWith('it') ? 'it' : 'en';
          document.documentElement.lang = l;
        } catch (e) {}
      })();
    </script>

    <!-- JSON-LD structured data -->
    <script type="application/ld+json">
      [
        {
          "@context": "https://schema.org",
          "@type": "SoftwareApplication",
          "name": "AL\\CE",
          "applicationCategory": "UtilitiesApplication",
          "operatingSystem": "Windows",
          "offers": { "@type": "Offer", "price": 0, "priceCurrency": "USD" },
          "description": "A local AI assistant that runs entirely on your machine, private by design."
        },
        {
          "@context": "https://schema.org",
          "@type": "SoftwareApplication",
          "name": "CONT\\NUUM",
          "applicationCategory": "UtilitiesApplication",
          "operatingSystem": "Windows",
          "offers": { "@type": "Offer", "price": 0, "priceCurrency": "USD" },
          "description": "An AI-first knowledge base that organises and surfaces your personal information locally."
        }
      ]
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
